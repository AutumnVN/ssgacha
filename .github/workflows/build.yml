name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Release
        shell: bash
        run: |
          gh release view release >/dev/null 2>&1 || gh release create release --title release --generate-notes
          gh release upload release --clobber target/release/gacha.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
