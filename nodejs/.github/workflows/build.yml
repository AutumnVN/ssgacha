name: Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@v4
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release
        shell: bash
        run: |
          gh release view release >/dev/null 2>&1 || gh release create release --title release --generate-notes
          gh release upload release --clobber dist/gacha.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
